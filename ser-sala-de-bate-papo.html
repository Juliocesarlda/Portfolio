<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sala de Bate-Papo</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: var(--bg-color, #f0f0f0); color: var(--text-color, #000); }
    .chat-container { width: 80%; margin: 40px auto; padding: 20px; background-color: var(--container-bg, #fff); border: 1px solid #ddd; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
    .chat-header { background-color: #333; color: #fff; padding: 10px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .chat-messages { padding: 20px; overflow-y: auto; max-height: 400px; border-bottom: 1px solid #ccc; }
    .chat-message { margin-bottom: 10px; padding: 10px; border-bottom: 1px solid #ddd; }
    #message-input { width: 75%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
    #send-button { padding: 10px 20px; border-radius: 5px; background-color: #333; color: white; border: none; cursor: pointer; }
    
    /* Ajuste para dispositivos móveis */
    @media (max-width: 600px) {
      .main-wrapper {
        flex-direction: column !important;
        width: 95% !important;
      }
      
      #user-list {
        width: 100% !important;
        margin-bottom: 10px;
      }

      #message-input {
        width: 60% !important;
      }
    }
  </style>
</head>
<body>

  <div class="main-wrapper" style="display: flex; gap: 20px; width: 90%; margin: 20px auto;">
    <!-- Coluna Lateral -->
    <div id="user-list" style="width: 250px; background: #eee; padding: 15px; border-radius: 10px;">
      <h3>Usuários Online</h3>
      <div id="online-users"></div>
    </div>

    <!-- Chat Principal -->
    <div id="chat-container" class="chat-container" style="flex: 1; margin: 0;">
      <div class="chat-header">
        <h2>Sala de Bate-Papo <span id="target-user-display"></span></h2>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <input type="text" id="message-input" placeholder="Digite sua mensagem...">
      <button id="send-button">Enviar</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <script>
    // Configuração e Inicialização do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyALQICorKSuacosN8YLmRZneufs6mwO4s0",
      authDomain: "sistema-de-engajamento-e-risco.firebaseapp.com",
      projectId: "sistema-de-engajamento-e-risco",
      storageBucket: "sistema-de-engajamento-e-risco.firebasestorage.app",
      messagingSenderId: "473328409083",
      appId: "1:473328409083:web:bc74aded0063776379935e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    // Elementos do DOM
    const chatMessages = document.getElementById('chat-messages');
    const messageInput = document.getElementById('message-input');
    const sendButton = document.getElementById('send-button');
    const onlineUsersList = document.getElementById('online-users');
    const targetUserDisplay = document.getElementById('target-user-display');

    // Captura e sanitização do parâmetro 'usuario'
    const urlParams = new URLSearchParams(window.location.search);
    let rawUser = urlParams.get('usuario');

    // Se o usuário não estiver preenchido ou for inválido, gera um identificador padrão
    if (!rawUser || rawUser.trim() === "") {
      rawUser = "Visitante_" + Math.floor(1000 + Math.random() * 9000);
    }
    const username = rawUser.trim();

    let targetUser = null;

    // Autenticação anônima e controle de presenças via UID
    auth.signInAnonymously().then((cred) => {
      const uid = cred.user.uid;
      const userRef = db.ref("usuarios/" + uid);
      
      // Salva os dados do usuário usando o UID como chave primária
      userRef.set({ 
        nome: username, 
        status: "online", 
        inChat: true 
      });

      // Remove o usuário da lista ao desconectar (fechar aba ou navegador)
      userRef.onDisconnect().remove();
    }).catch((error) => {
      console.error("Erro na autenticação anônima:", error);
    });

    // Renderizar lista de usuários online
    db.ref("usuarios").on("value", (snapshot) => {
      onlineUsersList.innerHTML = "";
      snapshot.forEach((child) => {
        const userData = child.val();
        const displayName = userData.nome || "Anônimo";

        const div = document.createElement('div');
        div.style.marginBottom = "10px";
        div.innerHTML = `
          <span>${displayName}</span>
          <button onclick="setTarget('${displayName}')" style="margin-left: 5px;">Chamar</button>
        `;
        onlineUsersList.appendChild(div);
      });
    });

    // Função para selecionar destinatário para mensagem privada
    window.setTarget = (name) => {
      targetUser = name;
      targetUserDisplay.innerText = `(para: ${name})`;
    };

    // Renderizar mensagens no chat
    function renderMessage(data) {
      const msg = data.val();
      
      // Filtro para mensagens privadas
      const isPrivate = msg.to && (msg.to !== username && msg.user !== username);
      if (isPrivate) return;

      const div = document.createElement('div');
      div.className = 'chat-message';
      div.innerHTML = `<b>${msg.user} ${msg.to ? '→ ' + msg.to : ''}</b>: ${msg.text}`;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Ouvinte em tempo real para novas mensagens
    db.ref("mensagens").limitToLast(50).on("child_added", renderMessage);

    // Envio de mensagem
    sendButton.onclick = () => {
      const text = messageInput.value.trim();
      if (text) {
        db.ref("mensagens").push({ 
          user: username, 
          to: targetUser, 
          text: text, 
          timestamp: Date.now() 
        });
        messageInput.value = '';
        targetUser = null;
        targetUserDisplay.innerText = '';
      }
    };

    // Suporte para enviar com a tecla Enter
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendButton.click();
      }
    });
  </script>
</body>
</html>
