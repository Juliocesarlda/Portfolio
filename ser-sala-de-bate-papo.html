<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat Firebase com Emojis</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color, #f0f0f0);
      color: var(--text-color, #000);
    }
    .chat-container {
      width: 80%;
      margin: 40px auto;
      padding: 20px;
      background-color: var(--container-bg, #fff);
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .chat-header {
      background-color: #333;
      color: #fff;
      padding: 10px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-messages {
      padding: 20px;
      overflow-y: auto;
      max-height: 400px;
      border-bottom: 1px solid #ccc;
    }
    .chat-message {
      margin-bottom: 10px;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
    .chat-message .username {
      font-weight: bold;
      color: var(--text-color, #333);
    }
    .chat-message .message {
      color: var(--text-color, #666);
    }
    .chat-message .timestamp {
      font-size: 0.8em;
      color: #999;
      margin-left: 10px;
    }
    #message-input {
      width: 75%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    #send-button, #theme-toggle {
      padding: 10px 20px;
      margin-left: 5px;
      border-radius: 5px;
      background-color: #333;
      color: white;
      border: none;
      cursor: pointer;
    }
    #send-button:hover, #theme-toggle:hover {
      background-color: #555;
    }
    #loading {
      text-align: center;
      margin-top: 50px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>

  <!-- Mensagem simples de carregamento enquanto o Firebase verifica a sessão -->
  <div id="loading">Conectando à sala de bate-papo...</div>

  <div id="chat-container" style="display: none;" class="chat-container">
    <div class="chat-header">
      <h2>Sala de Bate-Papo 🙂 😊 😄 ❤ 💛 💙</h2>
      <button id="theme-toggle">🌙 Alternar Tema</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <input type="text" id="message-input" placeholder="Digite sua mensagem...">
    <button id="send-button">Enviar</button>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <script>
   const firebaseConfig = {
  apiKey: "AIzaSyALQICorKSuacosN8YLmRZneufs6mwO4s0",
  authDomain: "sistema-de-engajamento-e-risco.firebaseapp.com",
  projectId: "sistema-de-engajamento-e-risco",
  storageBucket: "sistema-de-engajamento-e-risco.firebasestorage.app",
  messagingSenderId: "473328409083",
  appId: "1:473328409083:web:bc74aded0063776379935e"
};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    const loadingElement = document.getElementById('loading');
    const chatContainer = document.getElementById('chat-container');
    const chatMessages = document.getElementById('chat-messages');
    const messageInput = document.getElementById('message-input');
    const sendButton = document.getElementById('send-button');
    const themeToggle = document.getElementById('theme-toggle');

    let username, avatarEmoji;

    const emojis = ['😀','😎','🧠','👻','🐱','🐶','🦊','🐵','🦄','🐸','🐯','🐼','🧙‍♂️','🧛‍♀️','👨‍🚀'];
    const emojiMap = {
      ':smile:': '😄', ':heart:': '❤️', ':love:': '😍', ':sun:': '☀️',
      ':moon:': '🌙', ':star:': '⭐', ':thumbsup:': '👍', ':fire:': '🔥'
    };

    function sanitize(input) {
      const div = document.createElement('div');
      div.innerText = input;
      return div.innerHTML;
    }

    function parseMarkdown(text) {
      let parsed = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      parsed = parsed.replace(/_(.*?)_/g, '<em>$1</em>');
      for (const code in emojiMap) {
        parsed = parsed.replaceAll(code, emojiMap[code]);
      }
      return parsed;
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      return `${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (text !== '') {
        db.ref("mensagens").push({
          user: username,
          emoji: avatarEmoji,
          text: text,
          timestamp: Date.now()
        });
        messageInput.value = '';
      }
    }

    function renderMessage(data) {
      const { user, emoji, text, timestamp } = data.val();
      const div = document.createElement('div');
      div.classList.add('chat-message');
      div.innerHTML = `<span class="username">${emoji || '👤'} ${sanitize(user)}</span>:
        <span class="message">${parseMarkdown(sanitize(text))}</span>
        <span class="timestamp">(${formatTime(timestamp)})</span>`;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Monitora o estado de autenticação do usuário
    auth.onAuthStateChanged((user) => {
      if (user) {
        // Pega o nome do cadastro Google/Email ou usa parte do e-mail caso não haja displayName
        const displayName = user.displayName || (user.email ? user.email.split('@')[0] : 'Visitante');
        username = sanitize(displayName);
        avatarEmoji = emojis[Math.floor(Math.random() * emojis.length)];

        // Oculta mensagem de carregamento e exibe o chat
        loadingElement.style.display = 'none';
        chatContainer.style.display = 'block';

        // Escuta novas mensagens no Realtime Database
        db.ref("mensagens").limitToLast(100).off(); // Garante que não duplique ouvintes
        db.ref("mensagens").limitToLast(100).on("child_added", renderMessage);
      } else {
        // Se o usuário não estiver logado, realiza login anônimo fallback ou pode ser redirecionado
        auth.signInAnonymously().catch((error) => {
          console.error("Erro na autenticação:", error);
          alert("Erro ao conectar ao chat.");
        });
      }
    });

    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Alternar tema claro/escuro
    let dark = false;
    themeToggle.addEventListener('click', () => {
      dark = !dark;
      document.documentElement.style.setProperty('--bg-color', dark ? '#1e1e1e' : '#f0f0f0');
      document.documentElement.style.setProperty('--text-color', dark ? '#f0f0f0' : '#000');
      document.documentElement.style.setProperty('--container-bg', dark ? '#2c2c2c' : '#fff');
      themeToggle.innerText = dark ? '☀️ Tema Claro' : '🌙 Tema Escuro';
    });
  </script>
</body>
</html>
